name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      # Runs before install, so a poisoned tree never gets to execute anything.
      - name: Payload check
        run: bun scripts/check-payload.ts

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - name: Build
        run: bun run build
        env:
          SESSION_SECRET: ci-only-not-a-real-secret-0123456789abcdef
